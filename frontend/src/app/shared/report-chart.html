<div class="chart-legend"><span>— Venta neta</span><span class="margin-key">- - Margen comercial</span></div><svg viewBox="0 0 720 240" role="img" aria-label="Evolución diaria de venta neta y margen comercial, en soles"><line x1="60" [attr.y1]="zero()" x2="700" [attr.y2]="zero()" class="axis"/><text x="4" y="20">{{max()|number:'1.0-0'}}</text><text x="4" y="215">{{min()|number:'1.0-0'}}</text><polyline [attr.points]="points('neto')" class="sales-line"/><polyline [attr.points]="points('margen')" class="margin-line"/>@if(rows().length===1){<circle cx="60" [attr.cy]="y(+rows()[0]['neto']!)" r="4" fill="var(--primary)"/><circle cx="60" [attr.cy]="y(+rows()[0]['margen']!)" r="3" fill="var(--muted)"/>}<text x="60" y="238">{{rows()[0]?.['fecha']}}</text><text x="700" y="238" text-anchor="end">{{rows()[rows().length-1]?.['fecha']}}</text></svg><p>Importes en S/. Los valores exactos están en la tabla diaria.</p>
